name: make-cgaf-hf-model-public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/make-hf-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface_hub>=0.26"
      - name: Change model repository visibility to public
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "lakshmianne/cgaf-qwen3-0.6b-seed42"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.update_repo_settings(
              repo_id=repo_id,
              repo_type="model",
              private=False,
          )
          info = api.model_info(repo_id)
          if info.private:
              raise SystemExit("Repository is still private")
          print(f"PUBLIC_MODEL=https://huggingface.co/{repo_id}")
          PY
