name: publish-cgaf-to-hugging-face\n# publication launcher v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-hf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface_hub>=0.26"
      - name: Submit secure GPU publication job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/submit_hf_publication.py \
            --repo-id "lakshmianne/cgaf-qwen3-0.6b-seed42" \
            --visibility "private"
